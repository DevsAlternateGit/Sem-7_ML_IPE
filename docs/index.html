<style>
/* Layout: a winding path of unit nodes; each unit opens a focused step player (numbered dots on top, one card, sticky answer bar at the bottom). Every unit owns one bright color. */
:root {
  --bg: #f2f4ff; --surface: #ffffff; --sunk: #f5f6fd; --ink: #1b1f3b; --muted: #6b7194; --line: #e1e5f6;
  --code-bg: #1b1f3b; --code-ink: #eef0ff; --code-line: #2c3263;
  --ok: #16a34a; --ok-b: #22c55e; --ok-soft: #dcfce7; --bad: #dc2626; --bad-b: #ef4444; --bad-soft: #fee2e2;
  --gold: #facc15; --gold-d: #ca8a04; --flame: #f97316; --tipbg: #eef4ff;
  --u0: #ff4d6d; --u1: #3b82f6; --u2: #f59e0b; --u3: #10b981; --u4: #8b5cf6; --u5: #22c55e; --u6: #06b6d4;
  --u7: #ef4444; --u8: #f97316; --u9: #6366f1; --u10: #ec4899; --u11: #14b8a6; --u12: #64748b;
  --tk-kw: #c4a0ff; --tk-str: #86efac; --tk-num: #fdba74; --tk-com: #8089b8; --tk-def: #93c5fd; --tk-builtin: #67e8f9;
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1226; --surface: #181c36; --sunk: #13172e; --ink: #eef0ff; --muted: #9aa0c3; --line: #2a3058;
    --code-bg: #0a0d1f; --code-line: #232a52; --ok-soft: #10331f; --bad-soft: #3b1520; --tipbg: #1c2448; --ok: #4ade80; --bad: #f87171;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1226; --surface: #181c36; --sunk: #13172e; --ink: #eef0ff; --muted: #9aa0c3; --line: #2a3058;
  --code-bg: #0a0d1f; --code-line: #232a52; --ok-soft: #10331f; --bad-soft: #3b1520; --tipbg: #1c2448; --ok: #4ade80; --bad: #f87171;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
code, kbd, pre { font-family: var(--f-mono); }
:not(pre) > code { font-size: 0.86em; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
kbd { font-size: 0.82em; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 8px; padding: 1px 8px; background: var(--surface); white-space: nowrap; font-weight: 600; }
a { color: var(--u1); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--u1); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.1; margin: 0; text-wrap: balance; }

/* chunky buttons */
.btn { --c: var(--u1); border: 0; border-radius: 14px; padding: 11px 20px 9px; font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: 0.02em; cursor: pointer;
  background: var(--c); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 70%, #000); transition: transform .06s, box-shadow .06s; text-transform: uppercase; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 70%, #000); }
.btn.ghost { background: var(--surface); color: var(--muted); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); padding: 9px 18px 7px; }
.btn.small { font-size: 14px; padding: 7px 14px 5px; border-radius: 11px; }
.btn[disabled] { background: var(--line); color: var(--muted); box-shadow: 0 4px 0 color-mix(in srgb, var(--line) 70%, #000); cursor: not-allowed; }
.iconbtn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 6px; border-radius: 10px; display: grid; place-items: center; }
.iconbtn:hover { background: var(--sunk); color: var(--ink); }
.iconbtn svg { width: 26px; height: 26px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 2px solid var(--line);
  display: flex; align-items: center; gap: 14px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: var(--f-display); font-weight: 800; font-size: 22px; white-space: nowrap; border: 0; background: none; padding: 0; }
.logo svg { width: 36px; height: 36px; }
.logo b { color: var(--u1); }
.stats { display: flex; gap: 6px; margin-left: auto; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.stat { display: flex; align-items: center; gap: 4px; font-family: var(--f-display); font-weight: 800; font-size: 18px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat svg { width: 22px; height: 22px; }
.stat.xp { color: var(--gold-d); } .stat.fire { color: var(--flame); } .stat.med { color: var(--u4); }
button.stat { border: 0; background: none; cursor: pointer; }
button.stat:hover { background: var(--sunk); }
.kpill { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); padding: 4px 10px; border-radius: 999px; background: var(--sunk); max-width: 240px; }
.kpill i { width: 9px; height: 9px; border-radius: 50%; background: var(--u2); flex: none; animation: pulse 1.2s infinite; }
.kpill.ready i { background: var(--ok-b); animation: none; }
.kpill.busy i { background: var(--u1); }
.kpill.fail i { background: var(--bad-b); animation: none; }
.kpill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes pulse { 50% { opacity: .3; } }

.page { padding-block: 28px 90px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

/* home hero */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 20px; }
.hero .bit svg { width: 110px; height: 110px; animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.hero h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 800; }
.hero h1 span { color: var(--u1); }
.hero p { margin: 6px 0 12px; color: var(--muted); font-weight: 600; }
.bigbar { height: 18px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bigbar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--ok-b), var(--u6)); border-radius: 999px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.12), inset 0 4px 0 rgba(255,255,255,.35); transition: width .6s; }
.herostats { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-weight: 700; color: var(--muted); font-size: 14px; }
.herostats b { color: var(--ink); font-family: var(--f-display); font-size: 20px; }

/* path */
.path { display: flex; flex-direction: column; align-items: center; gap: 72px; padding-block: 58px 30px; overflow-x: clip; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; transform: translateX(var(--off)); }
.nodebtn { --c: var(--u1); position: relative; width: 92px; height: 92px; border-radius: 50%; border: 0; cursor: pointer; background: transparent; padding: 0; }
.nodebtn .ring { position: absolute; inset: -9px; width: 110px; height: 110px; transform: rotate(-90deg); }
.nodebtn .disc { position: absolute; inset: 0; border-radius: 50%; background: var(--c); box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 65%, #000); display: grid; place-items: center; color: #fff; transition: transform .08s; }
.nodebtn:hover .disc { transform: translateY(-2px) scale(1.03); }
.nodebtn:active .disc { transform: translateY(5px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 65%, #000); }
.nodebtn .disc svg { width: 44px; height: 44px; }
.nodebtn .crown { position: absolute; right: -8px; bottom: -4px; width: 38px; height: 46px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.node .lab { text-align: center; max-width: 200px; }
.node .lab b { font-family: var(--f-display); font-size: 19px; display: block; line-height: 1.15; }
.node .lab span { font-size: 13px; color: var(--muted); font-weight: 700; }
.bubble { position: absolute; top: -48px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--c, var(--u1)); border: 2px solid var(--line); font-family: var(--f-display); font-weight: 800; padding: 3px 14px; border-radius: 12px; white-space: nowrap; animation: hop 1.2s ease-in-out infinite; z-index: 2; letter-spacing: .04em; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%) rotate(45deg); width: 12px; height: 12px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); }
@keyframes hop { 50% { transform: translate(-50%, -6px); } }
.section-tag { font-family: var(--f-display); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-size: 14px; text-align: center; }

/* player */
.player { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
.ptop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 12px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 900px; margin: 0 auto; width: 100%; }
.dots { flex: 1; min-width: 0; display: flex; align-items: center; overflow-x: auto; padding: 6px 4px; scrollbar-width: none; }
.dots::-webkit-scrollbar { display: none; }
.dot { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; font-family: var(--f-display); font-weight: 800; font-size: 14px; display: grid; place-items: center;
  background: var(--line); color: var(--muted); position: relative; padding: 0; font-variant-numeric: tabular-nums; }
.dot.done { background: var(--uc); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--uc) 65%, #000); }
.dot.cur { background: var(--surface); color: var(--uc); box-shadow: 0 0 0 3px var(--uc); transform: scale(1.12); }
.dot.build:not(.done):not(.cur) { background: color-mix(in srgb, var(--gold) 45%, var(--line)); color: var(--ink); }
.dot.skip:not(.cur) { background: color-mix(in srgb, var(--bad-b) 25%, var(--line)); }
.seg { flex: 1 0 8px; min-width: 8px; height: 5px; background: var(--line); }
.seg.done { background: var(--uc); }
.pmain { flex: 1; padding-block: 14px 150px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; animation: cardin .28s ease-out; }
@keyframes cardin { from { opacity: 0; transform: translateY(10px); } }

.prose { font-size: 17px; max-width: 70ch; }

.note { background: var(--tipbg); border-radius: 14px; padding: 10px 14px; font-size: 15px; }

.pic { background: #fff; border-radius: 18px; padding: 10px; border: 2px solid var(--line); }

.part { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 14px; align-items: start; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }

.blankline { background: var(--code-bg); color: var(--code-ink); border-radius: 18px; padding: 22px 20px; font-family: var(--f-mono); font-size: clamp(15px, 2.4vw, 19px); display: flex; flex-wrap: wrap; align-items: center; gap: 2px; box-shadow: 0 6px 0 color-mix(in srgb, var(--code-bg) 70%, #000); }

.blankline input.ok { color: var(--ok-b); border-bottom-color: var(--ok-b); border-bottom-style: solid; }

/* lesson widgets */
.mock { border-radius: 14px; overflow: hidden; border: 2px solid var(--line); font-family: var(--f-mono); font-size: 13.5px; }

.keygrid, .srcgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; margin: 10px 0; }
.keycard, .src { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; }

.rule { font-family: var(--f-display); font-size: 22px; background: color-mix(in srgb, var(--uc) 15%, var(--surface)); border: 3px solid var(--uc); border-radius: 16px; padding: 10px 16px; text-align: center; }

/* notebook */
.task { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.task .q { font-size: 16.5px; }

.reqs { list-style: none; padding: 10px 14px; margin: 0; background: var(--sunk); border-radius: 14px; display: grid; gap: 4px; font-weight: 600; font-size: 15px; }
.reqs li { display: grid; grid-template-columns: 24px 1fr; gap: 6px; }

.reqs li.ok::before { content: "✓"; color: var(--ok); }
.reqs li.bad::before { content: "✗"; color: var(--bad); }
.nb { display: flex; flex-direction: column; gap: 8px; }
.cell { display: grid; grid-template-columns: 62px minmax(0, 1fr) 26px; gap: 0 6px; align-items: start; }

.cell.running .clbl { color: var(--u8); }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.CodeMirror { height: auto; font-family: var(--f-mono); font-size: 14px; line-height: 1.55; background: transparent; color: var(--ink); }

.ed .cm-s-default .cm-variable, .ed .cm-s-default .cm-property, .ed .cm-s-default .cm-operator, .ed .cm-s-default .cm-variable-2,
.typebox .cm-s-default .cm-variable, .typebox .cm-s-default .cm-property, .typebox .cm-s-default .cm-operator, .typebox .cm-s-default .cm-variable-2 { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ed .cm-s-default .cm-keyword, :root:not([data-theme="light"]) .typebox .cm-s-default .cm-keyword { color: var(--tk-kw); }

  :root:not([data-theme="light"]) .ed .cm-s-default .cm-def, :root:not([data-theme="light"]) .typebox .cm-s-default .cm-def { color: var(--tk-def); }
  :root:not([data-theme="light"]) .ed .cm-s-default .cm-builtin, :root:not([data-theme="light"]) .typebox .cm-s-default .cm-builtin { color: var(--tk-builtin); } }
:root[data-theme="dark"] .ed .cm-s-default .cm-keyword, :root[data-theme="dark"] .typebox .cm-s-default .cm-keyword { color: var(--tk-kw); }
:root[data-theme="dark"] .ed .cm-s-default .cm-string, :root[data-theme="dark"] .typebox .cm-s-default .cm-string { color: var(--tk-str); }
:root[data-theme="dark"] .ed .cm-s-default .cm-number, :root[data-theme="dark"] .typebox .cm-s-default .cm-number { color: var(--tk-num); }
.codeline .cm-keyword, .blankline .cm-keyword, .sol .cm-keyword { color: var(--tk-kw); font-weight: 700; }
.codeline .cm-string, .blankline .cm-string, .sol .cm-string { color: var(--tk-str); }
.codeline .cm-number, .blankline .cm-number, .sol .cm-number { color: var(--tk-num); }
.codeline .cm-comment, .sol .cm-comment { color: var(--tk-com); font-style: italic; }
.codeline .cm-def, .sol .cm-def { color: var(--tk-def); }
.codeline .cm-builtin, .sol .cm-builtin { color: var(--tk-builtin); }
.CodeMirror-hints { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; font-family: var(--f-mono); font-size: 13px; box-shadow: 0 8px 20px rgba(0,0,0,.18); max-height: 16em; z-index: 40; }
.CodeMirror-hint { color: var(--ink); border-radius: 6px; }
li.CodeMirror-hint-active { background: var(--u1); color: #fff; }

/* footer */
.pfoot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 2px solid var(--line); padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: background .2s; }
.pfoot.ok { background: var(--ok-soft); border-top-color: transparent; }
.pfoot.bad { background: var(--bad-soft); border-top-color: transparent; }
.pfin { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.fb { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 12px; }
.fb svg { width: 58px; height: 58px; flex: none; }
.fb .msg b { font-family: var(--f-display); font-size: 22px; display: block; line-height: 1.1; }
.pfoot.ok .msg b { color: var(--ok); } .pfoot.bad .msg b { color: var(--bad); }

/* medal screen */
.finish { max-width: 640px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 20px; }

.finish h1 { font-size: clamp(34px, 7vw, 54px); color: var(--uc); font-weight: 800; }
.tally { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

.todo { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* medals + exam */
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.medal { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }

.medal span { font-size: 13px; color: var(--muted); font-weight: 700; }

.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px; }

.qcell.cur { outline: 3px solid var(--u1); outline-offset: 2px; }
.timer { font-family: var(--f-display); font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums; color: var(--u1); }
.examhead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.examhead svg.troph { width: 64px; height: 64px; color: var(--gold-d); }

.drawer { position: fixed; inset: 0; z-index: 45; background: rgba(10, 12, 30, .45); display: flex; justify-content: flex-end; }
.drawer .panel { width: min(640px, 100%); height: 100%; background: var(--surface); overflow-y: auto; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 40px 22px; display: flex; flex-direction: column; gap: 10px; }
.drawer .panel pre { background: var(--code-bg); color: var(--code-ink); padding: 12px; border-radius: 12px; overflow-x: auto; font-size: 13px; }
.drawer .panel table { border-collapse: collapse; font-size: 14px; }
.drawer .panel td, .drawer .panel th { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.drawer .panel .tbl { overflow-x: auto; }
.drawer h3 { font-size: 20px; margin-top: 12px; }
.viva dt { font-weight: 800; margin-top: 8px; } .viva dd { margin: 2px 0 0; color: var(--muted); font-weight: 600; }

.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 14px; font-weight: 700; max-width: calc(100vw - 32px); animation: tin .25s ease-out; }
@keyframes tin { from { opacity: 0; transform: translate(-50%, 10px); } }

@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; text-align: center; justify-items: center; }
  .herostats { justify-content: center; }
  .kpill span { display: none; }
  .logo span { display: none; }
  .stat { font-size: 16px; padding: 2px 4px; }
  .part { grid-template-columns: 1fr; gap: 6px; }

  .cell { grid-template-columns: 34px minmax(0, 1fr) 22px; }
  .cell .clbl { font-size: 9.5px; }
  .fb svg { width: 44px; height: 44px; }
  .pfin .btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>
<header class="top" id="top">

    <div class="stat fire" title="First-try streak"><span id="fireIcon"></span><span id="fireN">0</span></div>
    <button class="stat med" id="medBtn" title="Medals"><span id="medIcon"></span><span id="medN">0</span></button>
  </div>
</header>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
